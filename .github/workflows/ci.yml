name: CI

# CARVE is stdlib-only by design, so CI installs nothing: a job that needs no
# `pip install` is itself the proof of that claim. If a third-party import ever
# sneaks in, this workflow breaks on the import, not in review.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the suite (no dependencies, no installs)
        run: python -m unittest discover tests -v
